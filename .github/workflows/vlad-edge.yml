name: Vlad Termux Edge

on:
  pull_request:
    paths:
      - "edge/termux/**"
      - "docs/continue-continue/VLAD_TERMUX_EDGE.md"
      - "docs/continue-continue/VLAD_ROUTING_SHEET.md"
      - "docs/continue-continue/VLAD_CLI.md"
      - "scripts/verify-continue-continue-standards.mjs"
      - ".github/workflows/vlad-edge.yml"
  push:
    branches: [main]
    paths:
      - "edge/termux/**"
      - "docs/continue-continue/VLAD_TERMUX_EDGE.md"
      - "docs/continue-continue/VLAD_ROUTING_SHEET.md"
      - "docs/continue-continue/VLAD_CLI.md"
      - "scripts/verify-continue-continue-standards.mjs"
      - ".github/workflows/vlad-edge.yml"

permissions:
  contents: read

jobs:
  vlad-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tiny edge runtime ingress doctor and human CLI
        run: >-
          python -m py_compile
          edge/termux/vlad_edge.py
          edge/termux/vlad_router.py
          edge/termux/vlad_doctor.py
          edge/termux/vlad_cli.py
      - name: Run Vlad authority routing ingress readiness and CLI tests
        run: python -m unittest discover -s edge/termux -p 'test_*.py'
