name: Main Branch Build

# Download and republish VS Code extension artifacts when code is merged to main
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_pr_number:
        description: "PR number to test with"
        required: true

jobs:
  republish-pr-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact-platform:
          - linux-x64
          - win32-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Get the last 2 commits to find the merge commit

      - name: Get merged PR number
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR number for the current commit using GitHub API
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Getting PR for commit: $COMMIT_SHA"

          PR_NUMBER=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" \
            | jq -r '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not find PR for commit $COMMIT_SHA"
            exit 1
          fi

          echo "Found PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Find PR artifact workflow run
        id: find-run
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Getting branch name for PR #$PR_NUMBER..."

          BRANCH_NAME=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')

          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ Could not find PR #$PR_NUMBER"
            exit 1
          fi

          echo "Branch name: $BRANCH_NAME"

          # PR Build And Upload VSIX is the workflow that owns the artifacts
          # consumed below. Query that producer directly instead of PR Checks.
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow="pr-build-upload-vsix.yaml" \
            --branch="$BRANCH_NAME" \
            --json databaseId,status,conclusion \
            --jq ".[] | select(.status == \"completed\" and .conclusion == \"success\") | .databaseId" \
            | head -1)

          if [ -z "$RUN_ID" ]; then
            echo "❌ No successful VSIX artifact workflow run found for PR #$PR_NUMBER (branch: $BRANCH_NAME)"
            exit 1
          fi

          echo "Found successful artifact workflow run: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download PR artifact
        env:
          RUN_ID: ${{ steps.find-run.outputs.run_id }}
          ARTIFACT_PLATFORM: ${{ matrix.artifact-platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="vscode-extension-build-$ARTIFACT_PLATFORM"
          echo "📥 Downloading $ARTIFACT_NAME from run $RUN_ID..."

          mkdir -p ./temp-download

          if ! gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$ARTIFACT_NAME" \
            --dir "./temp-download"; then
            echo "❌ Failed to download $ARTIFACT_NAME from run $RUN_ID"
            exit 1
          fi

          echo "✅ Successfully downloaded artifact"

      - name: Republish as main branch artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-build-${{ matrix.artifact-platform }}
          path: ./temp-download/*
