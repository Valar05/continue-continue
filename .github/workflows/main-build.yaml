name: Main Branch Build

# Download and republish VS Code extension artifacts when code is merged to main.
# workflow_dispatch + test_pr_number is the pre-merge acceptance lane.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_pr_number:
        description: "PR number whose exact-head VSIX artifacts should be republished"
        required: true

jobs:
  republish-pr-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact-platform:
          - linux-x64
          - win32-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve source PR number
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.test_pr_number }}"
            echo "Using explicitly requested PR #$PR_NUMBER for acceptance."
          else
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "Getting merged PR for commit: $COMMIT_SHA"
            PR_NUMBER=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" \
              | jq -r '.[0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not resolve a source PR"
            exit 1
          fi

          echo "Resolved PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Find exact-head PR artifact workflow run
        id: find-run
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Resolving artifact producer for PR #$PR_NUMBER..."

          PR_JSON=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json headRefName,headRefOid)
          BRANCH_NAME=$(echo "$PR_JSON" | jq -r '.headRefName')
          PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')

          if [ -z "$BRANCH_NAME" ] || [ -z "$PR_HEAD_SHA" ] || [ "$PR_HEAD_SHA" = "null" ]; then
            echo "❌ Could not resolve branch/head SHA for PR #$PR_NUMBER"
            exit 1
          fi

          echo "Branch: $BRANCH_NAME"
          echo "Exact PR head: $PR_HEAD_SHA"

          # PR Build And Upload VSIX owns the artifacts consumed below.
          # Require the successful run to match the exact PR head SHA so a stale
          # success from an older commit can never be republished as current.
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow="pr-build-upload-vsix.yaml" \
            --branch="$BRANCH_NAME" \
            --json databaseId,status,conclusion,headSha \
            --jq ".[] | select(.headSha == \"$PR_HEAD_SHA\" and .status == \"completed\" and .conclusion == \"success\") | .databaseId" \
            | head -1)

          if [ -z "$RUN_ID" ]; then
            echo "❌ No successful VSIX artifact run found for exact PR head $PR_HEAD_SHA"
            exit 1
          fi

          echo "Found exact-head artifact workflow run: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "pr_head_sha=$PR_HEAD_SHA" >> $GITHUB_OUTPUT

      - name: Download exact-head PR artifact
        env:
          RUN_ID: ${{ steps.find-run.outputs.run_id }}
          PR_HEAD_SHA: ${{ steps.find-run.outputs.pr_head_sha }}
          ARTIFACT_PLATFORM: ${{ matrix.artifact-platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="vscode-extension-build-$ARTIFACT_PLATFORM"
          echo "📥 Downloading $ARTIFACT_NAME from exact-head run $RUN_ID ($PR_HEAD_SHA)..."

          mkdir -p ./temp-download

          if ! gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$ARTIFACT_NAME" \
            --dir "./temp-download"; then
            echo "❌ Failed to download $ARTIFACT_NAME from run $RUN_ID"
            exit 1
          fi

          echo "✅ Successfully downloaded exact-head artifact"

      - name: Republish as main branch artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-build-${{ matrix.artifact-platform }}
          path: ./temp-download/*
