name: Anvil Shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "edge/android-shell/**"
      - "edge/termux/vlad_notes.py"
      - "edge/termux/test_vlad_notes.py"
      - "edge/termux/install.sh"
      - "docs/continue-continue/ANVIL_SHELL.md"
      - ".github/workflows/anvil-shell.yml"

permissions:
  contents: read

jobs:
  deterministic-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test deterministic notes
        run: |
          python -m py_compile edge/termux/vlad_notes.py
          python -m unittest edge.termux.test_vlad_notes

  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK pieces
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and assemble checkpoint APK
        run: gradle -p edge/android-shell :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-shell-debug-source-checkpoint
          path: edge/android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
