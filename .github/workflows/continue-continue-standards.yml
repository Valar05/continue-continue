name: Continue Continue Standards

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify Continue Continue standards
        run: node scripts/verify-continue-continue-standards.mjs
